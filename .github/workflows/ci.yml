# Proves the bring-up still works: lint the playbook and scripts, scan the history for
# leaked secrets, then run bootstrap.sh from a blank Arch and a blank Ubuntu 26.04 container
# exactly as a new machine would, and run it a second time to prove it changes nothing.
name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install ansible-lint with the collections the playbook uses
        run: |
          pipx install ansible-lint
          pipx inject --include-apps ansible-lint ansible
      - name: ansible-lint (production profile) and syntax check
        working-directory: ansible
        run: |
          ansible-lint
          ansible-playbook --syntax-check playbook.yml
      - name: shellcheck
        run: shellcheck bootstrap.sh install.sh ansible/roles/dotfiles/files/stow-package.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans every commit, not just the tip
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bootstrap:
    name: bootstrap (${{ matrix.distro }})
    runs-on: ubuntu-latest
    timeout-minutes: 180 # Ubuntu compiles Hyprland and its libraries
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: arch
            image: archlinux:latest
          - distro: ubuntu
            image: ubuntu:26.04
    container:
      image: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install git and sudo (checkout needs git for a real clone; bootstrap.sh needs sudo)
        run: |
          case "${{ matrix.distro }}" in
            arch)   pacman -Syu --noconfirm git sudo ;;
            ubuntu) apt-get update -qq && apt-get install -y -qq git sudo ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bootstrap as an unprivileged user with passwordless sudo, like a fresh install
        run: |
          useradd -m -s /bin/bash tester
          echo 'tester ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/tester
          mkdir -p /home/tester/projects
          cp -r "$GITHUB_WORKSPACE" /home/tester/projects/dots
          chown -R tester:tester /home/tester
          su - tester -c 'cd ~/projects/dots && ./bootstrap.sh'
      - name: Run it again; a second run must change nothing
        run: |
          su - tester -c 'cd ~/projects/dots && ./bootstrap.sh' | tee rerun.log
          grep -E '^localhost .*changed=0 .*failed=0 ' rerun.log
