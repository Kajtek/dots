system_services:
  - NetworkManager
  - bluetooth
  - power-profiles-daemon

greetd_user: _greetd
greetd_vt: 7
greetd_command: tuigreet --cmd start-hyprland --remember --time

# Environment for every build: find what earlier entries installed, and use GCC 16.
source_builds_env:
  PATH: "/usr/local/bin:{{ ansible_facts.env.PATH }}"
  PKG_CONFIG_PATH: /usr/local/lib/pkgconfig:/usr/local/share/pkgconfig
  CMAKE_PREFIX_PATH: /usr/local
  CC: gcc-16
  CXX: g++-16

# Built in this order, each into /usr/local unless the entry says otherwise. Every download is
# checked against its sha256 (the Arch PKGBUILDs' values for the hypr* tarballs). A finished
# entry leaves the stamp /usr/local/share/dots-build/<name>-<version>; bumping a version
# here rebuilds only that entry. Versions are the Arch packages' versions at the time of
# pinning (see git log for this file).
cmake_build: >-
  cmake -B build -D CMAKE_BUILD_TYPE=Release -D CMAKE_INSTALL_PREFIX=/usr/local
  -D CMAKE_INSTALL_LIBDIR=lib -D CMAKE_SKIP_RPATH=ON
  && cmake --build build -j "$(nproc)"
cmake_install: cmake --install build
meson_build: >-
  meson setup build --prefix=/usr/local --libdir=lib --buildtype=release
  && meson compile -C build
meson_install: meson install -C build

source_builds:
  - name: wayland  # wayland-protocols 1.49 needs wayland-scanner 1.25+ to generate its headers; Ubuntu ships 1.24
    version: "1.26.0"
    url: https://gitlab.freedesktop.org/wayland/wayland/-/releases/1.26.0/downloads/wayland-1.26.0.tar.xz
    sha256: 64176eaa46e4969903e286f8e5ef8331affc17fdf03ac9b58381d2b23162b7a3
    build: >-
      meson setup build --prefix=/usr/local --libdir=lib --buildtype=release
      -Ddocumentation=false -Dtests=false
      && meson compile -C build
    install: "{{ meson_install }}"
  - name: wayland-protocols  # Hyprland needs 1.49, Ubuntu ships 1.47
    version: "1.49"
    url: https://gitlab.freedesktop.org/wayland/wayland-protocols/-/releases/1.49/downloads/wayland-protocols-1.49.tar.xz
    sha256: ec4c8f74942d6dff7ace8b4ce4764f0ef9ff618a935d974ea77edee2ad240b14
    build: >-
      meson setup build --prefix=/usr/local --libdir=lib --buildtype=release -Dtests=false
      && meson compile -C build
    install: "{{ meson_install }}"
  - name: lua  # Hyprland's config runtime needs 5.5; Ubuntu stops at 5.4. lua.org ships no .pc file.
    version: "5.5.1"
    url: https://www.lua.org/ftp/lua-5.5.1.tar.gz
    sha256: 1c4b4068d67061f2a2231ad2b5422e77acea1487ea9890f6320af614f4373dce
    build: make MYCFLAGS=-fPIC linux
    install: >-
      make INSTALL_TOP=/usr/local install
      && printf '%s\n' 'prefix=/usr/local' 'libdir=${prefix}/lib' 'includedir=${prefix}/include' ''
      'Name: Lua' 'Description: Lua 5.5' 'Version: 5.5.1'
      'Libs: -L${libdir} -llua -lm -ldl' 'Cflags: -I${includedir}'
      > /usr/local/lib/pkgconfig/lua5.5.pc
  - name: hyprwayland-scanner
    version: "0.4.6"
    url: https://github.com/hyprwm/hyprwayland-scanner/archive/refs/tags/v0.4.6.tar.gz
    sha256: 05f55fd1a20d8ca81b5030980fdb7c87147749230145bdb3745af2741d617f5c
