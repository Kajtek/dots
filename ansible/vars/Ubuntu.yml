  - g++-16          # Hyprland 0.56 uses C++26 library features that GCC 15's libstdc++ lacks; upstream builds with GCC 16
  - cmake
  - meson
  - ninja-build
  - pkgconf
  - python3
  - libwayland-dev
  - libwayland-bin
