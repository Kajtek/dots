  - libnotify-dev
  - libgtest-dev
  - libreadline-dev # hyprctl

# Fonts apt lacks at the versions the waybar config was written against; unpacked into
# ~/.local/share/fonts/<name>.
fonts:
  - name: font-awesome-7.3.1
    url: https://github.com/FortAwesome/Font-Awesome/releases/download/7.3.1/fontawesome-free-7.3.1-desktop.zip
    sha256: c61edde261707f33376a28e9a30bb8c70c1a20bf0bd975206b809f3b3b70add5
    include: ["*/otfs/*"]
  - name: nerd-fonts-symbols-3.4.0
    url: https://github.com/ryanoasis/nerd-fonts/releases/download/v3.4.0/NerdFontsSymbolsOnly.tar.xz
