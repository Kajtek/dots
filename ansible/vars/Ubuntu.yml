# Ubuntu 26.04 LTS. apt covers the tooling and the desktop around Hyprland, but Hyprland needs
# a release with the Lua config format (0.56+) that Ubuntu does not ship. Hyprland, its
# libraries and every hypr* tool are therefore built from pinned upstream releases into
# /usr/local (source_builds below); mixing apt's hypr* packages in would load two versions of
# the same libraries into one process. The pins match the Arch packages this setup runs on, so
# both machines behave the same. Two components install outside /usr/local because their hosts
# only look there: xdg-desktop-portal-hyprland (xdg-desktop-portal scans /usr/share) and the
# QML style module (Qt's import path).

# Vendor repositories, each signed by the vendor's own keyring URL (deb822 sources).
apt_repositories:
  - name: brave-browser
    uris: https://brave-browser-apt-release.s3.brave.com/
    suites: stable
    components: main
    signed_by: https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
  - name: signal-desktop
    uris: https://updates.signal.org/desktop/apt
    suites: xenial
    components: main
    architectures: amd64
    signed_by: https://updates.signal.org/desktop/apt/keys.asc
  - name: vscode
    uris: https://packages.microsoft.com/repos/code
    suites: stable
    components: main
    architectures: amd64
    signed_by: https://packages.microsoft.com/keys/microsoft.asc

apt_packages:
  # tooling
  - git
  - git-lfs
  - stow
  - jq
  - curl
  - ca-certificates
  - unzip
  - xz-utils
  - cargo           # builds wl-clip-persist: no apt package, no prebuilt release
  # desktop pieces around the hypr* stack
  - xdg-desktop-portal
  - xdg-desktop-portal-gtk
  - xwayland
  - qt6-wayland
  - qml6-module-qtquick-controls    # hyprpolkitagent's QML runtime
  - qml6-module-qtquick-layouts
  - qml6-module-qtquick-templates
  - qml6-module-qtqml-workerscript
  - waybar
  - mako-notifier
  - kanshi
  - kitty
  - starship
  - brightnessctl
  - wl-clipboard
  - flameshot
  - blueman
  - pavucontrol
  - pipewire
  - pipewire-audio
  - wireplumber
  - power-profiles-daemon
  - bluez
  - network-manager
  - gnome-keyring
  - polkitd
  - libnotify-bin
  - greetd
  - tuigreet        # regreet is not packaged; tuigreet is the greeter on Ubuntu
  - fonts-hack
  - fonts-noto-core
  # from the vendor repositories above
  - brave-browser
  - signal-desktop
  - code            # Microsoft's build; it does not read ~/.vscode-oss/argv.json

# Build dependencies for source_builds; -dev packages only.
apt_build_packages:
