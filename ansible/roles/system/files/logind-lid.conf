# Installed by the dots playbook. Hyprland's "switch:on/off:Lid Switch" binds call
# ~/.local/bin/lid-handler.sh, which decides between suspend and turning the panel off;
# logind must not act on the lid itself.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
