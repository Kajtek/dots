# Lock screen. Laid out like the login screen (regreet, styled by
# ansible/roles/system/files/greetd-regreet.css): a clock card at the top centre and a login card in
# the middle, both translucent black with the 2px teal border and 12px window radius, over the
# blurred desktop. Hack as everywhere else, #FF6633 only for a failed attempt.
$font = Hack

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
}

# Clock card, regreet's top frame: just the time, "%H:%M" as in greetd-regreet.toml.
shape {
    monitor =
    size = 160, 56
    color = rgba(0, 0, 0, 0.6)
    rounding = 12
    border_size = 2
    border_color = rgba(21d6c9ff)

    position = 0, -15
    halign = center
    valign = top
}

label {
    monitor =
    text = $TIME
    color = rgb(255, 255, 255)
    font_size = 20
    font_family = $font

    position = 0, -28
    halign = center
    valign = top
}

# Login card, regreet's centre frame: user name over the password entry.
shape {
    monitor =
    size = 420, 150
    color = rgba(0, 0, 0, 0.6)
    rounding = 12
    border_size = 2
    border_color = rgba(21d6c9ff)

    position = 0, 0
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(21d6c9ff)
    font_size = 14
    font_family = $font

    position = 0, 35
    halign = center
    valign = center
}

# A GTK entry inside the card: faint fill, small radius, teal ring.
input-field {
    monitor =
    size = 380, 44
    outline_thickness = 2
    inner_color = rgba(255, 255, 255, 0.08)

    outer_color = rgba(21d6c9ff)
    check_color = rgba(33ccffff)
    fail_color = rgba(ff6633ff)

    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    rounding = 6

    font_family = $font
    placeholder_text = <span alpha="50%">Password</span>
    fail_text = $PAMFAIL
    dots_spacing = 0.3

    position = 0, -20
    halign = center
    valign = center
}
