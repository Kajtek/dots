# Lock screen. Same look as the rest of the desktop: a glass pill with the teal-to-cyan gradient
# of the focused window border, Hack as in kitty and waybar, white values under teal labels, and
# #FF6633 only for a failed attempt.
$font = Hack

general {
    hide_cursor = false
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 2
    inner_color = rgba(0, 0, 0, 0.6) # waybar's glass, over the blurred screenshot

    outer_color = rgba(21d6c9ee) rgba(33ccffee) 45deg
    check_color = rgba(33ccffee) rgba(21d6c9ee) 45deg
    fail_color = rgba(ff6633ee)

    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    rounding = -1 # fully round, like the waybar pills

    font_family = $font
    placeholder_text = <span alpha="50%">Password</span>
    fail_text = $PAMFAIL
    dots_spacing = 0.3

    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(255, 255, 255)
    font_size = 90
    font_family = $font Bold

    position = -30, 0
    halign = right
    valign = top
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgba(21d6c9ee)
    font_size = 25
    font_family = $font

    position = -30, -150
    halign = right
    valign = top
}
