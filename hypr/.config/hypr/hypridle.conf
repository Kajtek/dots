# Idle policy. hypridle is started from hyprland.lua; hyprlock does the locking.
# Hyprland runs a Lua config, so `hyprctl dispatch` takes Lua; braces are escaped for hyprlang.
general {
    lock_cmd = pidof hyprlock || hyprlock
    # Wake the panel before locking: an image taken with the panel off resumes to a black screen.
    before_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms(\{ action = "on" \})'; loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms(\{ action = "on" \})'
}

# Lock the session after 5 minutes idle.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Turn the screen off 30 seconds later; any input turns it back on.
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms(\{ action = "off" \})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms(\{ action = "on" \})'
}
