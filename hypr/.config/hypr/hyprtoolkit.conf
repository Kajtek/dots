# Theme for hyprtoolkit apps (hyprlauncher on Super+R, Hyprland's dialogs). Same look as the rest
# of the desktop: black glass, teal #21D6C9 accent fading into the window border's cyan, white
# text, Hack, and the 12px window radius (hyprland.lua, mako, the waybar cards).
# Options: https://wiki.hypr.land/Hypr-Ecosystem/hyprtoolkit/

background       = rgba(000000e6)
base             = rgba(0f1a1fff)
alternate_base   = rgba(16252bff)
text             = rgba(ffffffff)
bright_text      = rgba(ffffffff)
accent           = rgba(21d6c9ff)
accent_secondary = rgba(33ccffff)

font_family           = Hack
font_family_monospace = Hack
font_size             = 11

rounding_large = 12
rounding_small = 8
