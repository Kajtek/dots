font_family      Hack
bold_font        auto
italic_font      auto
bold_italic_font auto

foreground #a8dff0
background #000000

# Palette tuned to the desktop accent (teal #21D6C9, as in waybar, mako and the window border):
# cyan is that teal, blue is the border's second stop, and "red" is the same #FF6633 the bars use
# for warnings, so errors read as warnings everywhere. The rest are softened to sit beside them.
cursor               #21D6C9
cursor_text_color    #000000
selection_foreground #000000
selection_background #21D6C9
url_color            #33ccff

active_tab_foreground   #000000
active_tab_background   #21D6C9
inactive_tab_foreground #a8dff0
inactive_tab_background #0f1a1f
tab_bar_background      #000000

# black
color0  #1c2328
color8  #4f5b63
# red
color1  #FF6633
color9  #ff8c66
# green
color2  #3ddc97
color10 #7aeab8
# yellow
color3  #f2c55c
color11 #f8dc94
# blue
color4  #33ccff
color12 #85e0ff
# magenta
color5  #c58af9
color13 #dcb8fc
# cyan
color6  #21D6C9
color14 #7ae8df
# white
color7  #c8d3da
color15 #ffffff

background_opacity 0.8
enable_audio_bell no
