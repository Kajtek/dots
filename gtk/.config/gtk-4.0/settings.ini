# GTK settings, used as is under X11. On Wayland GTK reads the same values from gsettings,
# which hyprland.lua sets at startup; keep the two in step. adw-gtk3-dark (adw-gtk-theme) gives
# GTK 3 apps the libadwaita look, so both toolkits match; gtk.css next to this file adds the teal.
[Settings]
gtk-theme-name=adw-gtk3-dark
gtk-icon-theme-name=Adwaita
gtk-font-name=Hack 10
gtk-cursor-theme-name=Breeze_Light
gtk-cursor-theme-size=24
gtk-application-prefer-dark-theme=1
